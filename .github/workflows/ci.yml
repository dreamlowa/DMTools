name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Тесты (unittest)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Проверить синтаксис
        run: python -m py_compile converter.py converter_utils.py gui.py main.py scanner.py scanner_devices.py scanner_diag.py updater.py version.py

      - name: Запустить юнит-тесты
        run: python -m unittest discover -s tests -v

  build:
    name: Сборка EXE (при теге)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Собрать EXE
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File ./build_exe.ps1

      - name: Проверить артефакт
        run: Test-Path dist/DMTools.exe

      - name: Загрузить релиз на GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/DMTools.exe `
            --title "${{ github.ref_name }}" `
            --notes "Автоматическая сборка из CI (GitHub Actions)."